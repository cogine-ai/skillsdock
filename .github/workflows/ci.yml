name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'codex/**'
      - 'cursor/**'
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install

      - name: Validate agent registry
        run: node scripts/validate-agent-registry.mjs

      - name: Check docs are in sync with registry
        run: |
          node scripts/sync-agent-docs.mjs
          git diff --exit-code README.md COMPATIBILITY.md

      - name: Run test suite
        run: npm test
